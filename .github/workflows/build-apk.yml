name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > jmzs-release.keystore
            printf "storeFile=jmzs-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
              "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS" > keystore.properties
            echo "Keystore restored."
          else
            echo "No keystore secrets found; release will be unsigned."
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jmzs-app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
